# Fingerprints (fprintd), FIDO2/U2F keys (pam_u2f) and the OpenPGP card key, in a
# panel opened from the control center. The noctalia-security-hw helper (../helper)
# talks to the hardware: one operation per process, one JSON object per output line.

id = "lbssousa/security-hardware"
name = "Security Hardware"
version = "1.0.0"
plugin_api = 42
author = "lbssousa"
license = "MIT"
tags = ["security", "system", "utility"]
icon = "fingerprint"
description = "Enroll fingerprints, register FIDO2/U2F keys and set up the OpenPGP card key."

[[setting]]
key = "helper"
type = "string"
label_key = "settings.helper.label"
description_key = "settings.helper.description"
default = "noctalia-security-hw"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 560
height = 680
placement = "floating"
position = "center"
keyboard_focus = "on_demand"
dismiss_on_outside_click = true

[[shortcut]]
id = "shortcut"
entry = "shortcut.luau"
