# Plugin source for Noctalia: add it with
#   noctalia msg plugins source add security-hardware git https://github.com/lbssousa/noctalia-security-hardware
# The plugin.toml in each plugin directory stays the source of truth.

[[plugin]]
id = "lbssousa/security-hardware"
name = "Security Hardware"
version = "2.0.0"
author = "lbssousa"
license = "MIT"
icon = "fingerprint"
description = "Enroll fingerprints, register FIDO2/U2F keys, set up the OpenPGP card key and manage resident SSH keys."
plugin_api = 42
tags = ["security", "system", "utility", "yubikey", "ssh"]
